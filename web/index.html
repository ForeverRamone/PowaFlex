<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowaFlex — Gestión de cine</title>
    <!-- el icono es el PNG del monograma P+F; el SVG viejo (la claqueta) se retiró -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- apply the saved look before first paint, or the app flashes the default -->
    <script>
      try {
        var t = localStorage.getItem('ui_theme');
        if (t && t !== 'cartelera') document.documentElement.dataset.ui = t;
        if (localStorage.getItem('ui_language') === 'en') {
          document.documentElement.lang = 'en';
          document.title = 'PowaFlex — Film collection manager';
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
