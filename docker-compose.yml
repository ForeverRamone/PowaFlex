services:
  powaflex:
    # Imagen publicada automáticamente desde GitHub (recomendado).
    # Para construir desde el código fuente, comenta "image" y descomenta "build".
    image: ghcr.io/foreverramone/powaflex:latest
    # build: .
    container_name: powaflex
    restart: unless-stopped
    ports:
      - '3860:3860'
    volumes:
      # PowaFlex ajusta solo los permisos de esta carpeta al arrancar y luego
      # corre sin privilegios: no hace falta tocar nada a mano al actualizar.
      - ./data:/data
    environment:
      - TZ=Europe/Madrid
      # Opcional: usuario con el que correr y al que pertenecerán los datos.
      # Sin esto se respeta el dueño que ya tenga la carpeta (en unRAID,
      # nobody:users) y, si es de root, se usa 1000:1000.
      # - PUID=99
      # - PGID=100
      # Cifra las credenciales (Plex/TMDB/Radarr) en disco. Pon una frase larga y
      # secreta; si la pierdes tendrás que volver a introducir las claves en Ajustes.
      # - POWAFLEX_SECRET=cambia-esto-por-una-frase-larga-y-secreta
      # Autenticación del panel (HTTP Basic, "usuario:contraseña"). Sin ella
      # cualquiera en la red local puede leer y cambiar los ajustes, así que es
      # muy recomendable si el puerto queda expuesto.
      # - POWAFLEX_AUTH=usuario:contraseña
    labels:
      - net.unraid.docker.icon=https://raw.githubusercontent.com/ForeverRamone/PowaFlex/main/assets/icon.png
